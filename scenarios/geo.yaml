# Terräng och vatten utan ekologi i vägen.
#
# Steg 7:s första patchar handlar om geologin och hydrologin, och de går att
# döma bäst i en värld där ingenting annat rör sig. Faunan är därför borta helt
# och floran sådd till en hundradel av bördighetens tak — nog för att fältens
# konsumenter ska ha en läsare, för lite för att 300 000 plantor ska dölja
# landskapet i viewern.
#
# Bördigheten är densamma som i f4-start20, så att näringsjämvikten går att
# jämföra rakt av när vittringen blir terrängberoende i 7007.
namn: geo
varld:
  bredd: 64
  hojd: 256
  bordighet: 4.0
  terrang:
    seed: 1
    relief: 1.0
    # Bandet i cellbredder. Övre gränsen avgör var bruset slutar och de
    # placerade formerna tar vid.
    # Bandets övre ände som andel av världens kortaste sida. 0,75 av 64 är
    # de 48 cellbredder som gällde när talet var absolut.
    lambda_max_frac: 0.75
    lambda_min: 3.0
    # Spektrallutning. Låga värden ger finkornigt landskap där varje sänka är
    # sin egen ändstation; höga ger få stora former och inga sjöar.
    beta: 2.4
    # Havet som bred bassäng vid basnivån. Andelen styr; radien löses fram.
    hav_andel: 0.20
    hav_djup: 2.0
    base: 1.5
flora:
  sadd: 4000.0
  plantmassa: 1.32
fauna:
  antal: 0
  insatts_vid: start
  max_antal: 64
