# Första terrängvärlden med fauna. Motsvarar f4-start20 så långt det går, så
# att skillnaden mot den platta världen är terrängen och vattnet och inget
# annat: samma bördighet, samma antal grundare i tre fläckar, samma fartskala.
#
# Höjden är 128 i stället för 256. Latitudcykeln spänner då halva sträckan pol
# till ekvator, alltså brantare klimatgradient per rad, och världen är
# kvadratisk nog att kunna jämföras med senare körningar vid 256x256.
#
# Vad som skiljer mot f4-start20:
#
#   - havet är en bred bassäng vid basnivån, omkring 20 procent av cellerna,
#     och floran etablerar sig inte där eftersom markvattnet är noll
#   - nederbörden följer temperaturen över året, alltså sommarregn
#   - höjden kyler mot omlandet, vilket ger struktur inom latitudbanden
#   - markvattnet är tredje resurs i tillväxten vid sidan av näring och ljus
#
# `rain_base` är världens huvudsakliga täthetsreglage. Uppmätt vid 64x128 utan
# fauna över 6 000 tick:
#
#     0,40   bebodda landceller 51,5 %    8 601 kg flora
#     0,50                      61,8 %   10 397
#     0,65                      62,9 %   12 984      (förvalet)
#     0,85                      74,4 %   16 490
namn: f5-terrang
varld:
  bredd: 64
  hojd: 128
  bordighet: 4.0
  # Världens position på planeten. Klimatet härleds ur de två — se `klimat.py`.
  # 48 grader nord, halvvägs in i en landmassa, ger årsmedel 10,9 och amplitud
  # 12,2: kallast -1,4 i februari, varmast 23,1 i juli. Det är samma klimat som
  # 7013 satte för hand, men nu som en följd av var världen ligger.
  #
  # Talen står här trots att de är förvalet, eftersom de beskriver vilken värld
  # scenariot är. Att flytta världen är numera ett experiment i två tal.
  latitud: 48.0
  kontinentalitet: 0.55
  terrang:
    seed: 1
    relief: 1.0
    # Bandets övre ände som andel av världens kortaste sida. 0,75 av 64 är
    # de 48 cellbredder som gällde när talet var absolut.
    lambda_max_frac: 0.75
    lambda_min: 3.0
    beta: 2.4
    # Havet som bred bassäng. Det som anges är havsandelen och inte radien: radien
    # löses fram så att andelen träffas, vilket är skalfritt på ett sätt en radie
    # inte kan vara. Havet är basnivån och skalar därför med världen, till skillnad
    # från andra former vars mått är absoluta.
    #
    # Uppmätt över tre frön vid 64x128, grundhöjd 1,5 och djup 2,0:
    #
    #     radie 0,9   hav 15–17 %   sjö 2,1–4,8 %   flod 1 224–1 909   kust 1,16–1,51
    #     radie 1,0   hav 18–23 %   sjö 1,4–3,4 %   flod 1 161–1 629   kust 1,27–1,38
    #     radie 1,1   hav 22–28 %   sjö 1,2–3,2 %   flod 1 173–1 558   kust 1,31–1,39
    #
    # Kusttalet är kustlinjens längd delad med omkretsen hos en cirkel med samma
    # havsarea. Havsandelen 18–23 % ligger nära det polarhavet gav (19,3 %), så
    # landytan är i praktiken oförändrad.
    hav_andel: 0.20
    hav_lutning: 1.0

flora:
  sadd: bordighet
  plantmassa: 1.32
fauna:
  antal: 20
  insatts_vid: start
  flackar: 3
  flackradie: 20.0
  max_antal: 8192
fysiologi:
  fartskala: 0.5
  sociability: 0.8
  sociability_sd: 0.5
