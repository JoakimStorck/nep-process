# En värld med en placerad sjö.
#
# Terrängens strategiska lager är en lista av former; bruset är textur. Utan
# `former` gäller havet ensamt, som världens basnivå. Med listan beskriver man
# i stället vad världen ska ha, och fröet styr bara detaljen — men då måste
# havet anges självt, eftersom listan tar över helt.
#
# Alla mått är i cellängder, samma enhet som vågrätt avstånd, eftersom
# cellarean är 1. En bassäng på djup 1,2 är alltså lite mer än en cellbredd
# djup. Positionerna är andel av utsträckningen; **radierna är det inte.** En
# rygg är en tektonisk struktur med en storlek i meter och ska inte växa för
# att kartan blir större.
#
# Havsnivån sätts alltid ur `hav_andel`, även med egen formlista: havet är en
# nivå och inte en form. Formerna bestämmer var det låga ligger, kvantilen var
# vattenlinjen går.
namn: geo-d-placerad-sjo
varld:
  bredd: 64
  hojd: 128
  bordighet: 4.0
  terrang:
    seed: 1
    noise_sd: 0.17
    # Bandets övre ände som andel av världens kortaste sida. 0,75 av 64 är
    # de 48 cellbredder som gällde när talet var absolut.
    lambda_max_frac: 0.75
    lambda_min: 3.0
    beta: 2.4
    hav_andel: 0.20
    former:
      # Den regionala lutningen mot basnivån. Elliptisk, så den följer världens
      # form; djupet är fallhöjden från kant till mitt.
      - {typ: bassang, x: 0.5, y: 0.5, radie_x: 49.5, radie_y: 85.8, djup: 1.5}
      # Insjön: en bred, grund sänka en bit in på land. Djupet måste överstiga
      # vad havsbassängens kant faller över sjöns egen bredd, annars dräneras
      # den ut.
      - {typ: bassang, x: 0.30, y: 0.72, radie: 14.0, djup: 1.5}
      # En bergsrygg tvärs kontinenten. Nederbörden har en orografisk
      # modifierare, så regnskuggan uppstår av sig själv.
      - {typ: rygg, fran: [0.05, 0.30], till: [0.95, 0.38], bredd: 5.0, hojd: 1.0}
flora:
  sadd: 2000.0
  plantmassa: 1.32
fauna:
  antal: 0
  insatts_vid: start
  max_antal: 64
