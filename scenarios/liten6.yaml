# Liten terrängvärld för snabba styrningstest.
#
# Syftet är att kunna köra 600 tick på en kvart i stället för fyrtio minuter,
# med terräng och vatten närvarande. Den är **inte** ett ekologiskt scenario:
# beståndet kollapsar från 40 till omkring 11 på 600 tick även utan några
# ändringar, så den duger till att se *vad djuren gör* och inte till att avgöra
# om de klarar sig.
#
# 64x64 med samma terrängparametrar som f6-256 i övrigt. Latitud 30 i stället
# för 48, alltså årsmedel 21,7 och kallast 13,4 — tillräckligt varmt för att
# köld inte ska dominera bilden när det är vattnet man tittar på.

namn: liten6
varld:
  bredd: 64
  hojd: 64
  dt: 0.02
  bordighet: 4.0
  latitud: 30.0
  kontinentalitet: 0.55
  terrang:
    seed: 1
    lambda_max_frac: 0.75
    lambda_min: 3.0
    beta: 2.4
    hav_andel: 0.2
    hav_lutning: 1.0
flora:
  sadd: bordighet
  plantmassa: 1.32
fauna:
  antal: 40
  insatts_vid: start
  flackar: 2
  flackradie: 12.0
  max_antal: 1024
fysiologi:
  fartskala: 0.5
  sociability: 0.8
  sociability_sd: 0.5
